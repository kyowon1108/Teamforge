version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teamforge-db
    environment:
      POSTGRES_USER: teamforge
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: teamforge
    ports:
      - '5432:5432'
    volumes:
      - teamforge-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamforge -d teamforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamforge-pgdata:
